{% extends 'main/seller/seller_base.html' %}
{% block title %}Nasiya arizalari (Excel){% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
  <h1 class="text-xl font-bold text-gray-800 mb-1">Nasiya arizalari</h1>
  <p class="text-sm text-gray-500 mb-4">Faqat sizning do'koningiz mahsulotlariga tushgan arizalar Excel faylga yuklanadi.</p>
  <form method="get" class="flex flex-wrap items-end gap-3">
    <label class="text-sm">Dan<input type="date" name="date_from" value="{{ date_from }}" class="block rounded-lg border border-gray-300 px-3 py-2"></label>
    <label class="text-sm">Gacha<input type="date" name="date_to" value="{{ date_to }}" class="block rounded-lg border border-gray-300 px-3 py-2"></label>
    <button class="rounded-lg bg-gray-800 px-4 py-2 text-sm font-bold text-white">Ko'rish</button>
    <button name="download" value="1" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700">Excel yuklab olish</button>
  </form>
  <p class="mt-4 text-sm text-gray-700">Tanlangan davrda: <b>{{ count }}</b> ta ariza</p>
</div>
{% endblock %}
