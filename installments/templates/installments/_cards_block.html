<div class="mt-8 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-bold text-gray-800">Kartalarim</h3>
      </div>
  <div class="grid gap-4 sm:grid-cols-2">
    {% for card in cards %}
    <a href="{% url 'installments:card_history' card.pk %}" class="block rounded-2xl bg-gradient-to-br from-blue-700 to-indigo-900 p-5 text-white shadow-md">
      <div class="flex justify-between text-xs opacity-80"><span>{{ card.get_brand_display }}</span><span>{{ card.expiry_display }}</span></div>
      <p class="mt-6 text-lg tracking-widest">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; {{ card.last4 }}</p>
      <div class="mt-4 flex items-end justify-between">
        <span class="text-xs uppercase opacity-80">{{ card.holder_name|default:"&nbsp;" }}</span>
        <span class="text-sm font-bold">{{ card.balance|floatformat:0 }} so'm</span>
      </div>
    </a>
    {% empty %}
    <p class="text-sm text-gray-400">Hozircha karta yo'q.</p>
    {% endfor %}
  </div>
  <button type="button" onclick="document.getElementById('add-card-modal').classList.remove('hidden');document.getElementById('add-card-modal').classList.add('flex')"
          class="mt-4 w-full rounded-xl bg-orange-500 py-3 text-sm font-bold text-white hover:bg-orange-600">+ Karta qo'shish</button>
</div>

<div id="add-card-modal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="var m=document.getElementById('add-card-modal');m.classList.add('hidden');m.classList.remove('flex')"></div>
  <form method="post" action="{% url 'installments:add_card' %}" class="relative w-full max-w-md" autocomplete="off">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="rounded-2xl bg-gradient-to-br from-blue-700 to-indigo-900 p-6 text-white shadow-2xl">
      <p class="text-xs uppercase opacity-80">Karta qo'shish</p>
      <label class="mt-5 block text-xs opacity-80">Karta raqami</label>
      <input id="cc-number" name="card_number" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" required
             class="w-full rounded-lg bg-white/15 px-3 py-2.5 text-lg tracking-widest placeholder-white/40 outline-none focus:bg-white/25">
      <div class="mt-4 flex gap-3">
        <div class="w-1/3">
          <label class="block text-xs opacity-80">Muddati</label>
          <input id="cc-exp" name="expiry" inputmode="numeric" maxlength="5" placeholder="OO/YY" required
                 class="w-full rounded-lg bg-white/15 px-3 py-2.5 placeholder-white/40 outline-none focus:bg-white/25">
        </div>
        <div class="flex-1">
          <label class="block text-xs opacity-80">Karta egasi (ixtiyoriy)</label>
          <input name="holder_name" maxlength="60" placeholder="ISM FAMILIYA"
                 class="w-full rounded-lg bg-white/15 px-3 py-2.5 uppercase placeholder-white/40 outline-none focus:bg-white/25">
        </div>
      </div>
    </div>
    <button type="submit" class="mt-3 w-full rounded-xl bg-white py-3 text-sm font-bold text-blue-700 shadow hover:bg-gray-100">Tasdiqlash</button>
  </form>
</div>
<script>
(function () {
  var n = document.getElementById("cc-number"), e = document.getElementById("cc-exp");
  n.addEventListener("input", function () {
    n.value = n.value.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
  });
  e.addEventListener("input", function () {
    var d = e.value.replace(/\D/g, "").slice(0, 4);
    e.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
  });
})();
</script>
